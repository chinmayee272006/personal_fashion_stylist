{% extends "base.html" %}
{% block title %}Create Account — Fashion Stylist{% endblock %}

{% block content %}
<div class="section-center">
    <div class="card card-narrow">
        <h2>Create Account</h2>
        <p class="subtitle">Start your personalised style journey</p>

        <form method="POST" action="{{ url_for('register') }}" id="register-form">
            <div class="form-group">
                <label for="username">Username</label>
                <input type="text" id="username" name="username"
                       placeholder="e.g. fashionista_21"
                       value="{{ username | default('', true) }}" required>
            </div>

            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" name="email"
                       placeholder="you@example.com"
                       value="{{ email | default('', true) }}" required>
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password"
                       placeholder="Min 6 characters" required>
            </div>

            <div class="form-group">
                <label for="confirm_password">Confirm Password</label>
                <input type="password" id="confirm_password" name="confirm_password"
                       placeholder="Re-enter password" required>
            </div>

            <button type="submit" class="btn btn-primary" id="register-btn">Create Account</button>
        </form>

        <p class="form-footer">
            Already have an account? <a href="{{ url_for('login') }}">Log in</a>
        </p>
    </div>
</div>
{% endblock %}
