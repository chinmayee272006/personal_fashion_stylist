{% extends "base.html" %}
{% block title %}Log In — Fashion Stylist{% endblock %}

{% block content %}
<div class="section-center">
    <div class="card card-narrow">
        <h2>Welcome Back</h2>
        <p class="subtitle">Log in to your fashion dashboard</p>

        <form method="POST" action="{{ url_for('login') }}" id="login-form">
            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" name="email"
                       placeholder="you@example.com"
                       value="{{ email | default('', true) }}" required>
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password"
                       placeholder="Enter your password" required>
            </div>

            <button type="submit" class="btn btn-primary" id="login-btn">Log In</button>
        </form>

        <p class="form-footer">
            Don't have an account? <a href="{{ url_for('register') }}">Sign up</a>
        </p>
    </div>
</div>
{% endblock %}
